services:
  maths:
    build: .
    image: axiome:latest
    container_name: maths
    restart: unless-stopped
    # Lié à 127.0.0.1 : seul Apache (httpd) y accède, le conteneur n'est pas exposé publiquement.
    ports:
      - "127.0.0.1:4242:4242"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4242/"]
      interval: 30s
      timeout: 5s
      retries: 3
