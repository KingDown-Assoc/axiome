# =============================================================================
#  Exemple de reverse proxy Apache (httpd) vers le conteneur Maths.
#  Le conteneur Docker écoute en local sur 127.0.0.1:4242 (HTTP simple).
#  Apache termine le TLS et relaie tout vers le conteneur.
#  Remplace maths.example.com par ton domaine et adapte les chemins de certificats.
# =============================================================================
#
#  Modules requis (à activer dans httpd.conf) :
#    LoadModule proxy_module           modules/mod_proxy.so
#    LoadModule proxy_http_module      modules/mod_proxy_http.so
#    LoadModule ssl_module             modules/mod_ssl.so
#    LoadModule rewrite_module         modules/mod_rewrite.so
#    LoadModule headers_module         modules/mod_headers.so
#    LoadModule socache_shmcb_module   modules/mod_socache_shmcb.so
#
#  Puis :  Include conf/extra/reverse-proxy.example.conf
#          httpd -t && systemctl reload httpd
# =============================================================================

<VirtualHost *:80>
    ServerName maths.example.com

    # Laisse passer les challenges ACME (Let's Encrypt), redirige le reste vers HTTPS
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName maths.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/maths.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/maths.example.com/privkey.pem

    # Le conteneur ne fait que du HTTP en local
    ProxyPreserveHost On
    ProxyPass         / http://127.0.0.1:4242/
    ProxyPassReverse  / http://127.0.0.1:4242/

    # Informe l'app qu'elle est servie en HTTPS
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"
</VirtualHost>
