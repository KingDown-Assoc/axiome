# =============================================================================
#  maths.jules-aubert.info — reverse proxy Apache (httpd, Arch) vers Maths
#  Le conteneur Docker écoute en local sur 127.0.0.1:4242 (HTTP simple).
#  Apache gère le TLS et relaie tout vers le conteneur.
# =============================================================================
#  1) Modules requis (tu as déjà tout pour elec/asm) : proxy, proxy_http, ssl,
#     rewrite, headers, socache_shmcb.
#  2) Inclus ce fichier à la fin de /etc/httpd/conf/httpd.conf :
#       Include conf/extra/maths.jules-aubert.info.conf
#  3) Certificat :  certbot certonly --webroot ... -d maths.jules-aubert.info
#  4) Vérifie + recharge :  httpd -t && systemctl reload httpd
# =============================================================================

<VirtualHost *:80>
    ServerName maths.jules-aubert.info
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    ErrorLog  /var/log/httpd/maths_http_error.log
    CustomLog /var/log/httpd/maths_http_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName maths.jules-aubert.info

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/maths.jules-aubert.info/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/maths.jules-aubert.info/privkey.pem

    ProxyPreserveHost On
    ProxyPass         / http://127.0.0.1:4242/
    ProxyPassReverse  / http://127.0.0.1:4242/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    ErrorLog  /var/log/httpd/maths_error.log
    CustomLog /var/log/httpd/maths_access.log combined
</VirtualHost>
