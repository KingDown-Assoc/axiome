# Réglages Maths — inclus depuis le httpd.conf de l'image (Apache 2.4)
ServerName localhost

<Directory "/usr/local/apache2/htdocs">
    Options -Indexes
    AllowOverride None
    Require all granted
    # SPA : toute route inconnue retombe sur index.html
    FallbackResource /index.html
</Directory>

<IfModule mod_filter.c>
    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript image/svg+xml application/json
</IfModule>

<IfModule mod_headers.c>
    <FilesMatch "\.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "index\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    Header set X-Content-Type-Options "nosniff"
</IfModule>
